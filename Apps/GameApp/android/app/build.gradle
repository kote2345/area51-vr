plugins {
    id 'com.android.application'
}

def gameAssetDirectory = project.findProperty('A51_ASSET_DIR') ?: 'src/main/assets'
def a51EnableOpenXR = (project.findProperty('A51_ENABLE_OPENXR') ?: 'false').toBoolean()
def a51OpenXRHeadersDir = project.findProperty('A51_OPENXR_HEADERS_DIR') ?: ''
def a51OpenXRLoaderLibrary = project.findProperty('A51_OPENXR_LOADER_LIBRARY') ?: ''
def a51AndroidConfiguration = project.findProperty('A51_ANDROID_CONFIGURATION') ?: ''
def a51GBufferLowBw = (project.findProperty('A51_GBUFFER_LOW_BW') ?: 'false').toBoolean()
def a51DirectRender = (project.findProperty('A51_DIRECT_RENDER') ?: 'false').toBoolean()

android {
    namespace = 'com.area51.game'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.area51.game'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                arguments '-DA51_BUILD_SELECTED_APPS=ON',
                          '-DA51_ENABLE_QT=OFF',
                          '-DA51_BUILD_WINDOWS_TARGETS=OFF',
                          "-DA51_ENABLE_OPENXR=${a51EnableOpenXR ? 'ON' : 'OFF'}",
                          "-DA51_OPENXR_HEADERS_DIR=${a51OpenXRHeadersDir}",
                          "-DA51_OPENXR_LOADER_LIBRARY=${a51OpenXRLoaderLibrary}",
                          "-DA51_ANDROID_CONFIGURATION=${a51AndroidConfiguration}",
                          "-DA51_GBUFFER_LOW_BW=${a51GBufferLowBw ? 'ON' : 'OFF'}",
                          "-DA51_DIRECT_RENDER=${a51DirectRender ? 'ON' : 'OFF'}"
                abiFilters 'arm64-v8a'
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs = [
                'src/main/java',
                '../../../../xCore/3rdParty/SDL3/android-project/app/src/main/java'
            ]
            assets.srcDirs = [gameAssetDirectory]
        }
    }

    externalNativeBuild {
        cmake {
            path '../../../../CMakeLists.txt'
            version '3.31.6'
        }
    }

    buildFeatures {
        prefab = a51EnableOpenXR
    }
}

dependencies {
    if (a51EnableOpenXR) {
        implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
    }
}
